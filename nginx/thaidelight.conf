# Nginx reverse proxy config for Thai Delight Restaurant
# Place at /etc/nginx/sites-available/thaidelight.conf on the EC2 instance
# then: sudo ln -s /etc/nginx/sites-available/thaidelight.conf /etc/nginx/sites-enabled/

# Rate limiting zone (extra layer in front of the app-level rate limiter)
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=2r/s;

# Redirect all HTTP to HTTPS
server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name yourdomain.com www.yourdomain.com;

    # Certificates from Let's Encrypt (certbot) or AWS ACM if using an ALB in front
    ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security headers (defense in depth - app also sets these via helmet)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 6M; # allow menu image uploads, slightly above the 5MB app limit

    access_log /var/log/nginx/thaidelight_access.log;
    error_log  /var/log/nginx/thaidelight_error.log;

    # Stricter rate limit specifically on auth endpoints
    location /api/auth/ {
        limit_req zone=login_limit burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params.conf;
    }

    location /api/ {
        limit_req zone=general_limit burst=20 nodelay;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params.conf;
    }

    location /health {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params.conf;
        access_log off;
    }

    # Static frontend
    location / {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params.conf;
    }
}
